name: Verify Static Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-static-build
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  DEPLOY_TARGET: github-pages
  NEXT_PUBLIC_SITE_URL: https://stack-shade.github.io/algoforge
  NEXT_PUBLIC_BASE_PATH: /algoforge

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install --no-audit --no-fund

      - name: Set build date
        run: echo "NEXT_PUBLIC_BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Validate generated data
        run: test -s data/generated/site-manifest.json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Static export
        run: npm run build

      - name: Verify export
        run: |
          test -f out/index.html
          test -f out/algoforge/index.html || true
          test -f out/sitemap.xml
          test -f out/robots.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: algoforge-static-build
          path: out
          retention-days: 7
