name: Deploy AlgoForge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  DEPLOY_TARGET: github-pages
  NEXT_PUBLIC_SITE_URL: https://stack-shade.github.io/algoforge
  NEXT_PUBLIC_BASE_PATH: /algoforge

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_configured: ${{ steps.pages.outcome }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Set build date
        run: echo "NEXT_PUBLIC_BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Validate generated data
        run: test -s data/generated/site-manifest.json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build

      - name: Report Pages status
        if: steps.pages.outcome != 'success'
        run: echo "GitHub Pages is not enabled; build succeeded and deployment will be skipped."

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages_configured == 'success'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
